name: Release

# Push a tag like v1.0.0 to build, test and publish TaskbarLed-win-x64.zip as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test TaskbarLed.slnx -c Release

      - name: Publish
        run: dotnet publish src/TaskbarLed.App -c Release -r win-x64 --self-contained false -o artifacts/TaskbarLed

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path artifacts/TaskbarLed/* -DestinationPath TaskbarLed-win-x64.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" TaskbarLed-win-x64.zip --title "TaskbarLed ${{ github.ref_name }}" --generate-notes
