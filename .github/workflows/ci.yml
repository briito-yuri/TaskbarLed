name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TaskbarLed.slnx

      - name: Build
        run: dotnet build TaskbarLed.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TaskbarLed.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish app
        run: dotnet publish src/TaskbarLed.App -c Release -o artifacts/TaskbarLed

      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarLed
          path: artifacts/TaskbarLed
